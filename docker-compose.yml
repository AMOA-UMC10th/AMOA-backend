services:
  amoa-server:
    image: amoa-server:latest
    container_name: amoa-server
    restart: always
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_HOST: amoa-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - amoa-redis
    networks:
      - amoa-network

  amoa-redis:
    image: redis:7-alpine
    container_name: amoa-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - amoa_redis_data:/data
    networks:
      - amoa-network

networks:
  amoa-network:
    driver: bridge

volumes:
  amoa_redis_data: