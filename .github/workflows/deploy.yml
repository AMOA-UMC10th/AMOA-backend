name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: amoa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Rename JAR
        run: cp build/libs/*.jar app.jar

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/amoa-key.pem
          chmod 600 ~/.ssh/amoa-key.pem

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare EC2 deployment directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
        run: |
          ssh -i ~/.ssh/amoa-key.pem \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p /home/ubuntu/AMOA-backend"

          printf '%s\n' "$EC2_ENV_FILE" | \
            ssh -i ~/.ssh/amoa-key.pem \
            "$EC2_USER@$EC2_HOST" \
            "umask 077 && cat > /home/ubuntu/AMOA-backend/.env"

      - name: Upload deployment files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/amoa-key.pem \
            app.jar \
            Dockerfile \
            docker-compose.yml \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/AMOA-backend/"

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/amoa-key.pem \
            "$EC2_USER@$EC2_HOST" << 'EOF'
              set -e

              cd /home/ubuntu/AMOA-backend

              echo "===== Building Docker image ====="
              docker build -t amoa-server:latest .

              echo "===== Starting containers ====="
              docker compose up -d --force-recreate

              echo "===== Waiting for application ====="
              HEALTH_CHECK_SUCCESS=false

              for attempt in $(seq 1 30); do
                if curl -fsS http://localhost:8080/health | grep -q "OK"; then
                  echo "Application is healthy."
                  HEALTH_CHECK_SUCCESS=true
                  break
                fi

                echo "Health check attempt ${attempt}/30 failed."
                sleep 5
              done

              if [ "$HEALTH_CHECK_SUCCESS" != "true" ]; then
                echo "Application failed to become healthy."

                echo "===== Container status ====="
                docker compose ps

                echo "===== Application logs ====="
                docker logs --tail 200 amoa-server || true

                exit 1
              fi

              echo "===== Removing unused images ====="
              docker image prune -f

              echo "===== Running containers ====="
              docker compose ps

              echo "===== Application logs ====="
              docker logs --tail 50 amoa-server
          EOF