name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Spring Boot application
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/amoa-key.pem
          chmod 600 ~/.ssh/amoa-key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        run: |
          scp -i ~/.ssh/amoa-key.pem \
            build/libs/*.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/AMOA-backend/app.jar"

          scp -i ~/.ssh/amoa-key.pem \
            Dockerfile \
            docker-compose.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/AMOA-backend/"

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/amoa-key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
              set -e
              cd /home/ubuntu/AMOA-backend
              docker build -t amoa-server .
              docker compose up -d --force-recreate
              docker image prune -f
              docker ps
          EOF