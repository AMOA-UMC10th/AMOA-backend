spring:
  application:
    name: "amoa-server"
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버 클래스 이름
    url: ${DATABASE_URL} # jdbc:mysql://localhost:3306/{데이터베이스명}
    username: ${MYSQL_USER} # MySQL 유저 이름
    password: ${MYSQL_PASSWORD} # MySQL 비밀번호

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  jpa:
    database: mysql # 사용할 데이터베이스 유형 지정 (MySQL)
    database-platform: org.hibernate.dialect.MySQLDialect # Hibernate에서 사용할 MySQL 방언(dialect) 설정
    show-sql: false # 실행된 SQL 쿼리를 콘솔에 출력할지 여부 설정

    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 데이터베이스 스키마의 상태를 설정

    properties:
      hibernate:
        format_sql: true # 출력되는 SQL 쿼리를 보기 좋게 포맷팅


jwt:
  secret: ${JWT_SECRET_KEY}
  access-token:
    expiration-time: 3600000 # 1시간 (밀리초 단위)
  refresh-token:
    expiration-time: 1209600000 # 14일
  temp-token:
    expiration-time: 1800000 # 30분
  dev-token:
    expiration-time: 86400000
  issuer: amoa-server


kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  authorization-uri: https://kauth.kakao.com/oauth/authorize
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

api:
  key: ${KAKAO_API_KEY}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-phone-number: ${SOLAPI_SENDER_PHONE_NUMBER}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
  region: ${AWS_REGION}